<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Basic Meta -->
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- SEO Title (IMPORTANT) -->
    <title>SNSweb |Premium Digital Subscriptions & Gift Vouchers At Unbeatable Prices in India</title>

    <!-- Meta Description (IMPORTANT for Google ranking) -->
    <meta
      name="description"
      content="SNSweb is a premium online store offering digital Subcriptions, gift vouchers at the best prices in India. Fast delivery and secure payments."
    />

    <!-- SEO Keywords -->
    <meta
      name="keywords"
      content="SNSweb, online shopping, ecommerce India, digital products, gift vouchers, buy online, premium subscriptions, voucher code,subcription "
    />

    <!-- Author -->
    <meta name="author" content="SNSweb Team" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#000000" />

    <!-- Canonical URL (change your domain later) -->
    <link rel="canonical" href="https://yourdomain.com" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/tab4.png" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="/logo192.png" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph (For WhatsApp / Facebook / Instagram sharing) -->
    <meta property="og:title" content="SNSweb | Online Shopping Store" />
    <meta
      property="og:description"
      content="Buy digital Subcriptions, gift vouchers , voucher code online at best prices in India."
    />
    <meta property="og:image" content="/tab4.png" />
    <meta property="og:url" content="https://yourdomain.com" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SNSweb Online Store" />
    <meta
      name="twitter:description"
      content="Buy digital Subcriptions, gift vouchers , voucher code online at best prices in India."
    />
    <meta name="twitter:image" content="/tab4.png" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this application.
    </noscript>

    <div id="root"></div>
  </body>
</html>
